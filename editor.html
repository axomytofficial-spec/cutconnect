<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131d">
<title>Your editor profile — CutConnect</title>
<style>
:root{--bg:#0d1020;--panel:#151a2d;--text:#f6f7fb;--muted:#a7b0c7;--line:#2a3450;--lime:#c8ff5f}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% -10%,#28315a 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:560px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0 20px}
.brand{display:flex;gap:10px;align-items:center;font-weight:850;font-size:20px;text-decoration:none;color:inherit}
.logo{display:grid;place-items:center;width:38px;height:38px;background:var(--lime);color:#121521;border-radius:12px;font-weight:950}
.box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:12px}
h1{margin:0;font-size:28px;letter-spacing:-.8px}p{margin:0;color:var(--muted);font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:12px 16px;border:0;border-radius:13px;font:inherit;font-weight:800;cursor:pointer;background:var(--lime);color:#121521;width:100%;text-decoration:none}
.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{min-height:38px;font-size:13px;width:auto;padding:8px 12px}
.field{width:100%;min-height:48px;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:#12162a;color:var(--text);font:inherit}
form{display:grid;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2540;border:1px solid var(--line);padding:10px 16px;border-radius:12px;display:none;z-index:9;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a class="brand" href="index.html"><div class="logo">CC</div>CutConnect</a></div>
<div class="box">
<h1>Your editor profile</h1>
<p id="acct">Loading…</p>
<form id="f">
<div style="display:flex;align-items:center;gap:14px"><div id="phprev" style="width:84px;height:84px;border-radius:24px;background:#12162a center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;flex:none">No photo</div><div style="display:grid;gap:8px"><label class="btn secondary sm" for="photofile" style="cursor:pointer">Upload profile photo</label><input id="photofile" type="file" accept="image/*" style="display:none"><button id="photodel" class="btn secondary sm" type="button" style="display:none">Remove photo</button></div></div>
<p>Fields marked * are required. The rest are optional.</p>
<input id="editorname" class="field" placeholder="Your name / editing brand *" required maxlength="70">
<input id="skill" class="field" placeholder="Main skill * (e.g. Shorts)" required maxlength="70">
<select id="pstyle" class="field"><option>Shorts &amp; Reels</option><option>YouTube long-form</option><option>Gaming</option><option>Motion graphics</option></select>
<input id="rate" class="field" placeholder="Rate note (e.g. from Rs 500/video)" maxlength="60">
<input id="exp" class="field" placeholder="Experience (e.g. 2 years)" maxlength="40">
<input id="tools" class="field" placeholder="Tools (e.g. Premiere, CapCut)" maxlength="60">
<input id="prev" class="field" type="url" placeholder="Sample thumbnail link (optional, https://…)">
<input id="sampleurl" class="field" type="url" placeholder="Link to your sample * (YouTube / Drive)" required>
<button class="btn" type="submit">Publish my profile</button>
</form>
<div class="row"><a class="btn secondary sm" href="index.html">← Back to editors</a><button id="delme" class="btn secondary sm" type="button" style="display:none">Delete my profile</button><button id="pro" class="btn secondary sm" type="button">★ Join Pro / featured waitlist</button></div>
</div>
</div>
<div id="toast" role="status"></div>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=id=>document.getElementById(id);
const firebaseConfig={apiKey:"AIzaSyBjGiQMTg9tTIFirPT9sEpC51yTNuEumRo",authDomain:"pykule-98b57.firebaseapp.com",projectId:"pykule-98b57",appId:"1:348888874891:web:db31dd4ef09446ca46398e"};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
addEventListener('DOMContentLoaded',()=>{
if(typeof firebase==='undefined'){$('acct').textContent='Could not load. Open the site from its Netlify link.';return}
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),col=n=>db.collection(n);
let me=null,photo='';
function setPhoto(d){photo=d||'';const p=$('phprev');if(photo){p.style.backgroundImage='url('+photo+')';p.textContent='';$('photodel').style.display='inline-flex'}else{p.style.backgroundImage='none';p.textContent='No photo';$('photodel').style.display='none'}}
$('photofile').onchange=ev=>{const f=ev.target.files[0];if(!f)return;if(!/^image\//.test(f.type)){toast('Please choose an image.');return}
const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
const out=(s,q)=>{const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;x.fillStyle='#fff';x.fillRect(0,0,s,s);x.drawImage(im,sx,sy,m,m,0,0,s,s);return c.toDataURL('image/jpeg',q)};
let d=out(256,.8);if(d.length>60000)d=out(200,.6);if(d.length>60000)d=out(160,.5);
if(d.length>65000){toast('Photo is too large. Try another one.');return}
setPhoto(d)};im.onerror=()=>toast('Could not read this image. Try a JPG or PNG.');im.src=r.result};r.onerror=()=>toast('Could not read this image.');r.readAsDataURL(f);ev.target.value=''};
$('photodel').onclick=()=>setPhoto('');
auth.onAuthStateChanged(async u=>{
if(!u){auth.signInAnonymously().catch(x=>{$('acct').textContent=x.code==='auth/operation-not-allowed'||x.code==='auth/admin-restricted-operation'?'Setup needed: in Firebase Console → Authentication → Sign-in method, enable Anonymous.':x.code==='auth/unauthorized-domain'?'Setup needed: add this site address under Firebase Authentication → Settings → Authorized domains.':'Could not connect ('+(x.code||'error')+'). Check your internet and reload.'});return}
me={id:u.uid,name:''};
$('acct').textContent='No sign-up needed. Your profile will be public and is saved on this phone, so avoid clearing browser data.';
try{const d=await col('profiles').doc(me.id).get();if(d.exists){const m=d.data();$('editorname').value=m.name||'';$('skill').value=m.handle||'';$('pstyle').value=m.style||'Shorts & Reels';$('rate').value=(m.rate&&m.rate!=='Discuss directly')?m.rate:'';$('exp').value=m.exp||'';$('tools').value=m.tools||'';$('prev').value=m.prev?m.prev.u:'';$('sampleurl').value=m.sample||'';setPhoto(m.photo||'');$('delme').style.display='inline-flex'}}catch(e){}
});
$('f').onsubmit=async e=>{e.preventDefault();if(!me)return toast('Not connected yet. See the message at the top of the page.');const g=i=>$(i).value.trim(),pv=g('prev');
const d={name:g('editorname'),handle:g('skill'),skills:[g('skill')],style:$('pstyle').value,sample:g('sampleurl'),rate:g('rate')||'Discuss directly',exp:g('exp'),tools:g('tools'),prev:/^https:\/\//.test(pv)?{u:pv,v:0}:null,t:Date.now()};
if(photo)d.photo=photo;try{await col('profiles').doc(me.id).set(d);toast('Your profile is live. Opening editors…');$('delme').style.display='inline-flex';setTimeout(()=>location.href='index.html#editors',1200)}catch(x){toast(x.code==='permission-denied'?'Publish blocked by Firebase rules (permission-denied).':'Could not publish ('+(x.code||'error')+').')}};
$('delme').onclick=async()=>{if(!me)return;if(!confirm('Delete your profile? It will disappear from the site. You can create a new one anytime.'))return;try{await col('profiles').doc(me.id).delete();toast('Profile deleted.');$('delme').style.display='none';$('f').reset();setPhoto('')}catch(x){toast('Could not delete.')}};
$('pro').onclick=async()=>{if(!me)return;try{await col('waitlist').doc(me.id).set({t:Date.now()});toast('You are on the Pro waitlist. No payment taken.')}catch(x){toast('Could not join.')}};
});
</script>
</body></html>
